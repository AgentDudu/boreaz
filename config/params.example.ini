# Every parameter boreaz has, with its range and the default the instrument starts on. Copy this
# file, edit it, and start the app with `boreaz --config mine.ini`. The keys and numbers below are
# the ones the engine reads; the shipped `config/params.ini` is this file with someone's preferences
# already applied.
#
# One setting per line, `key = number`. A `#` starts a comment. A key that does not exist, a value
# that is not a number, and a number outside its range are all errors that stop the app with a line
# and a reason - a bad parameter file that quietly did nothing is indistinguishable from one that
# worked.
#
# What is set here is the starting point. Every one of these is also a slider in the window's Mixer
# (the button next to the view switcher), and the sliders win while the app is running: they move
# the sound over about ten milliseconds rather than snapping to it, which is what lets a player
# throw a filter open mid-phrase without a click.

# Volume and where the keyboard sits.

# Master gain in decibels, applied before the limiter. -12 is the default so that forty voices at
# full velocity still have room; 0 is the ceiling because above it the limiter starts working hard.
# Range -72 to 12.
master_gain_db = -12.0

# Keys added to every note that arrives, before the pitch bend. 12 moves the whole keyboard up an
# octave, and a key held when you move it moves with it. Range -24 to 24.
transpose_semitones = 0

# The same shift in octaves, for the octave slider next to the transpose. Range -4 to 4, and the
# total of the two is clamped so no note can leave the 88-key range.
octave_shift = 0

# What A above middle C is tuned to. 440 is the modern concert pitch; 415 is the same keyboard a
# semitone down, which is how a baritone tunes with a tenor. Range 415 to 466.
tuning_reference_hz = 440.0

# The filter. A piano's hammers put most of their energy in the low strings, so the cutoff is a
# multiple of the note's own frequency rather than a fixed corner.

# Cutoff as a multiple of the note's fundamental. 8 is where a struck string opens; 1 is a corner
# right at the fundamental, which is a lot of felt. Range 0.05 to 24.
filter_cutoff_ratio = 8.0

# How much the filter rings at its own corner. 0 is a plain slope, 1 is a whistle. Range 0 to 1.
filter_resonance = 0.35

# How much of the note's pitch is added to the cutoff. 1 tracks the keyboard note for note, which
# is what the default is for; 0 leaves the corner where it is however high you play. Range 0 to 1.
filter_keytrack = 1.0

# The oscillator mix. One is the fundamental, a triangle; the others are what makes it not a test
# signal. These are levels relative to the first, not percentages.

# The saw an octave below, which is the body of the note. Range 0 to 2.
osc2_level = 0.35

# The fifth above. Range 0 to 2.
osc3_level = 0.12

# How far apart the oscillator pairs are, in cents. A few cents is a detuned instrument; 4 is the
# default chorus, 0 is a pure interval. Range -100 to 100.
osc_detune_cents = 4

# The hammer. A short burst of noise at the top of the key travel, gone in tens of milliseconds.

# How loud it is against the string. Range 0 to 1.
noise_level = 0.12

# How long it lasts, in seconds. Range 0.001 to 2.
noise_decay_s = 0.06

# The amplitude envelope. A struck string is an attack and a long decay; there is no sustain at the
# end of it, because releasing the key is what stops the damper.

# Attack, in seconds. 0.004 is a hammer; anything above about 0.02 starts to sound like an organ.
# Range 0.0005 to 10.
amp_attack_s = 0.004

# Decay, in seconds, down to the sustain floor. The bass wants tens of seconds and the treble wants
# a few. Range 0.001 to 60.
amp_decay_s = 2.0

# Where the decay lands, as a fraction of full level. 0 is a piano; above 0 is a hold. Range 0 to 1.
amp_sustain = 0.18

# Release, in seconds, from wherever the note is when the key comes up. Range 0.005 to 60.
amp_release_s = 0.6

# Stereo and the pitch wheel.

# How far across the stereo field the keyboard is spread, low notes to the left. A piano is about
# two thirds of the way. Range 0 to 1.
pan_spread = 0.6

# How far the wheel bends, in semitones. This is what a real instrument's setting does, and it is
# what a guitar-style wheel expects. 0 turns the wheel off. Range 0 to 24.
bend_range_semitones = 2
