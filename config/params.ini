# boreaz - the instrument's own defaults.
#
# `key = value`, one per line, # starts a comment. This is also the shape of a saved patch: a patch
# may name only the keys it changes, because --config replaces this file and --params is applied on
# top of whichever one was used.
#
# Every key here is one the engine clamps in Params::sanitize, so a value outside the range is
# pulled into it rather than refused. An *unknown* key stops the app instead: a misspelled name
# that was quietly ignored is a patch that does not sound the way it is named.

# Level. The engine sums 16 voices before this, so the default leaves several notes of headroom.
master_gain_db = -6.0

# The three parabolas per voice, and the percussive noise partial.
osc2_level = 0.35
osc3_level = 0.2
osc_detune_cents = 7
noise_level = 0.0
noise_decay_s = 0.5

# The subtractive stage. Cutoff is a ratio of the note's own fundamental, which is why the voice
# brightens across the compass instead of closing up in the low register: the keyboard is the
# envelope.
filter_cutoff_ratio = 0.5
filter_resonance = 0.4
filter_keytrack = 0.3

# Per-voice amplifier, and the only two-oscillator-width stereo image there is until the effects
# phase adds a real one.
amp_attack_s = 0.01
amp_decay_s = 0.25
amp_sustain = 0.7
amp_release_s = 0.6
pan_spread = 0.25

# Global. A bend of a whole tone is the width a piano player's hand expects; transpose and octave
# shift move the keyboard without moving the sound, which is the difference between a low piano and
# a bad one.
bend_range_semitones = 2
transpose_semitones = 0
octave_shift = 0
